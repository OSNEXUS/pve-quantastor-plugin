# QuantaStor LUNs for the Proxmox VE QuantaStor storage plugin (pve-storage-quantastor).
# Applies only to storages with "multipath 1": multipathd claims a LUN only after the
# plugin whitelists its WWID (Debian's find_multipaths "strict" default).
devices {
    device {
        vendor               "OSNEXUS"
        product              "QUANTASTOR"
        path_grouping_policy "multibus"
        path_checker         "tur"
        failback             "immediate"
        # Queue ~120 s (24 x 5 s polling) when every path is down, e.g. during a
        # QuantaStor HA pool failover, instead of failing guest I/O.
        no_path_retry        24
    }
}
